# Builds the Android app (a Trusted Web Activity around the live site)
# for free on GitHub's servers, then publishes the APK as a GitHub
# Release so it can be downloaded straight onto a phone.
#
# Runs when android/ or this file changes on main, or on demand from
# the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings → Secrets and variables →
# Actions): ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  # Pull requests that touch the app get a test build (downloadable
  # from the run) but nothing is published.
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE: https://glowing-beauty-salon.vercel.app
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Missing signing secrets. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait until the website serves the app files
        run: |
          trap 'echo "::error title=Wait until the website serves the app files::Command failed (exit $?): $BASH_COMMAND"' ERR
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$SITE/icons/icon-512.png" \
              && curl -fsS -o /dev/null "$SITE/.well-known/assetlinks.json" \
              && curl -fsS -o /dev/null "$SITE/manifest.webmanifest"; then
              echo "Website is ready."
              exit 0
            fi
            echo "Waiting for the website deploy… ($i)"
            sleep 20
          done
          echo "::error::The live site isn't serving /icons, /.well-known/assetlinks.json or /manifest.webmanifest yet."
          exit 1

      - name: Install Bubblewrap and accept Android SDK licences
        run: |
          trap 'echo "::error title=Install Bubblewrap and accept Android SDK licences::Command failed (exit $?): $BASH_COMMAND"' ERR
          npm install -g @bubblewrap/cli
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # Bubblewrap checks for the old "tools" folder; GitHub's SDK only has
          # the newer cmdline-tools, so point the old name at it.
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          ls -la "$ANDROID_HOME" | head -20
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generate the Android project
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          trap 'echo "::error title=Generate the Android project::Command failed (exit $?): $BASH_COMMAND"' ERR
          set -o pipefail
          # Pasted secrets sometimes pick up spaces/line breaks — strip them.
          CLEAN=$(printf '%s' "$KS" | tr -d '[:space:]')
          if ! printf '%s' "$CLEAN" | base64 -d > android.keystore 2> b64.err; then
            BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "::error title=Signing key::ANDROID_KEYSTORE_BASE64 isn't valid (length ${#CLEAN}, expected 3576; ${BAD} unexpected characters; decoder said: $(cat b64.err)). Paste the entire contents of ANDROID_KEYSTORE_BASE64.txt and nothing else."
            exit 1
          fi
          if ! keytool -list -keystore android.keystore -storepass "$PW" -alias glowing > /dev/null 2>&1; then
            echo "::error title=Signing key::The keystore didn't open with ANDROID_KEYSTORE_PASSWORD (or alias 'glowing' is missing). Check both secrets match android-signing-secrets.txt exactly."
            exit 1
          fi
          # Each build gets a higher version number so phones accept it as an update.
          jq --argjson code "${{ github.run_number }}" --arg name "$VERSION_NAME" \
            '.appVersionCode = $code | .appVersionName = $name | .appVersion = ($code | tostring)' \
            twa-manifest.json > twa.tmp && mv twa.tmp twa-manifest.json
          if ! bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null 2>&1 | tee update.log; then
            msg=$(tail -n 60 update.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=bubblewrap update failed::$msg"
            exit 1
          fi

      - name: Build the signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          trap 'echo "::error title=Build the signed APK::Command failed (exit $?): $BASH_COMMAND"' ERR
          set -o pipefail
          if ! bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null 2>&1 | tee build.log; then
            msg=$(tail -n 60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=bubblewrap build failed::$msg"
            exit 1
          fi
          ls -la *.apk
          cp app-release-signed.apk "../GlowingBeautySalon-$VERSION_NAME.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowingBeautySalon-${{ env.VERSION_NAME }}
          path: GlowingBeautySalon-${{ env.VERSION_NAME }}.apk

      - name: Publish as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error title=Publish as a GitHub Release::Command failed (exit $?): $BASH_COMMAND"' ERR
          gh release create "android-$VERSION_NAME" "GlowingBeautySalon-$VERSION_NAME.apk" \
            --title "Android app $VERSION_NAME" \
            --latest \
            --notes "Open this page on an Android phone, tap the .apk file below to download it, then open it to install. You may need to allow installs from your browser the first time (Android asks automatically)."
